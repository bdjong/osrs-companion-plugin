# Every push and pull request: build the plugin jar (download it from the run's Artifacts).
# Pushing a tag like v1.0.0: also publish a GitHub Release with the jar attached.
name: Plugin

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the plugin version counts commits (see build.gradle)
      - name: The friend kit is not on main
        if: github.ref == 'refs/heads/main'
        run: |
          # friend/ and run-dev.bat live on development only (DEVELOPMENT.md > Branches).
          if [ -e friend ] || [ -e run-dev.bat ]; then
            echo "::error::The friend kit (friend/ or run-dev.bat) is on main. Delete it from main; it belongs on development only."
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew build
      - name: Check the licence is inside the jar
        run: |
          # LICENSE only: THIRD_PARTY_NOTICES.txt was dropped for the Plugin Hub review (LICENSE attributes the authors).
          for jar in build/libs/*.jar; do
            unzip -l "$jar" | grep -q 'META-INF/osrs-companion/LICENSE' || { echo "missing LICENSE in $jar"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-jar
          path: build/libs/*.jar
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
