plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'
def pluginMainClass = 'com.osrscompanion.OSRSCompanionPluginTest'

dependencies {
	compileOnly group: 'net.runelite', name:'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.12'
	testImplementation group: 'net.runelite', name:'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name:'jshell', version: runeLiteVersion
}

group = 'com.osrscompanion'
version = '1.0-SNAPSHOT'

// ---- Plugin version ---------------------------------------------------------------------------
// <base>.<patch>: the base comes from src/main/resources/com/osrscompanion/version.properties, the
// patch is the number of commits since its "base=" line last changed (the first base counts from
// the start of the repository). Written into the jar as com/osrscompanion/build-version.properties,
// which PluginVersion reads. Git must never fail the build: without git or with a shallow clone the
// file is not written and the plugin reports <base>-dev.
def versionFile = 'src/main/resources/com/osrscompanion/version.properties'

def gitOut = { List<String> args ->
	try {
		def proc = (['git'] + args).execute(null, rootDir)
		def out = new StringBuilder()
		proc.consumeProcessOutput(out, new StringBuilder())
		if (!proc.waitFor(20, java.util.concurrent.TimeUnit.SECONDS)) {
			proc.destroy()
			return null
		}
		return proc.exitValue() == 0 ? out.toString().trim() : null
	} catch (Exception ignored) {
		return null
	}
}

def computePluginVersion = {
	def props = new Properties()
	file(versionFile).withInputStream { props.load(it) }
	String base = props.getProperty('base', '0.0').trim()
	if (gitOut(['rev-parse', '--is-shallow-repository']) != 'false') {
		return null // no git, not a repository, or a shallow clone: the counts would be wrong
	}
	def changes = gitOut(['log', '--format=%H', '-G^base=', '--', versionFile])
	if (changes == null || changes.isEmpty()) {
		return null
	}
	def commits = changes.readLines()
	def count = commits.size() == 1
		? gitOut(['rev-list', '--count', 'HEAD'])
		: gitOut(['rev-list', '--count', "${commits[0]}..HEAD".toString()])
	if (count == null || !(count ==~ /\d+/)) {
		return null
	}
	return [version: "${base}.${count}".toString(), commit: gitOut(['rev-parse', '--short', 'HEAD']) ?: '']
}

def pluginVersionInfo = computePluginVersion()
def generatedVersionDir = layout.buildDirectory.dir('generated/plugin-version')

def generatePluginVersion = tasks.register('generatePluginVersion') {
	inputs.property('pluginVersion', pluginVersionInfo?.version ?: '')
	inputs.property('pluginCommit', pluginVersionInfo?.commit ?: '')
	outputs.dir(generatedVersionDir)
	doLast {
		def dir = generatedVersionDir.get().dir('com/osrscompanion').asFile
		project.delete(generatedVersionDir)
		if (pluginVersionInfo != null) {
			dir.mkdirs()
			new File(dir, 'build-version.properties').text =
				"version=${pluginVersionInfo.version}\ncommit=${pluginVersionInfo.commit}\n"
		}
	}
}

sourceSets.main.resources.srcDir(generatePluginVersion)

tasks.register('printPluginVersion') {
	doLast {
		println(pluginVersionInfo?.version ?: 'unknown (no full git history): the plugin reports <base>-dev')
	}
}

test {
	// Guard rethrows a failed assertion inside guarded code under tests instead of swallowing it,
	// so a failing test cannot pass. Production never sets this.
	systemProperty 'osrscompanion.guard.rethrowTestFailures', 'true'
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

// The licences must travel with every distributed jar, not only with the source.
// Their own folder keeps them from clashing with dependencies' META-INF/LICENSE in shadowJar.
tasks.withType(Jar).configureEach {
	from(rootDir) {
		include 'LICENSE', 'THIRD_PARTY_NOTICES.txt'
		into 'META-INF/osrs-companion'
	}
}

tasks.register('run', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass

	jvmArgs "-ea", "--add-exports", "java.desktop/com.apple.eawt=ALL-UNNAMED"
	args "--developer-mode", "--debug"
}

tasks.register('shadowJar', Jar) {
	dependsOn configurations.testRuntimeClasspath
	manifest {
		attributes('Main-Class': pluginMainClass, 'Multi-Release': true)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from sourceSets.test.output
	from {
		configurations.testRuntimeClasspath.collect { file ->
			file.isDirectory() ? file : zipTree(file)
		}
	}

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier.set('shadow')
	archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}
