plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'
def pluginMainClass = 'com.osrscompanion.OSRSCompanionPluginTest'

dependencies {
	compileOnly group: 'net.runelite', name:'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.12'
	testImplementation group: 'net.runelite', name:'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name:'jshell', version: runeLiteVersion
	// Tests only (the Plugin Hub builds just the main code): stand-ins for RuneLite classes in the UI golden tests.
	testImplementation 'org.mockito:mockito-core:4.11.0'
	// The RuneLite farming tables the website's Time Tracking data is checked against (they left the plugin).
	testCompileOnly 'org.projectlombok:lombok:1.18.30'
	testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'
}

group = 'com.osrscompanion'
version = '1.0-SNAPSHOT'

test {
	// Guard rethrows a failed assertion inside guarded code under tests instead of swallowing it,
	// so a failing test cannot pass. Production never sets this.
	systemProperty 'osrscompanion.guard.rethrowTestFailures', 'true'
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

// Local builds (the dev launcher, the friend kit) name their commit in the side panel ("v1.0.2-dev 48a4256").
// The Plugin Hub builds with its own build.gradle (build=standard), so its jar shows only the version.
def devBuildDir = layout.buildDirectory.dir('generated/dev-build')
tasks.register('devBuildInfo') {
	def out = devBuildDir.get().file('com/osrscompanion/dev-build.properties').asFile
	outputs.file(out)
	outputs.upToDateWhen { false }
	doLast {
		def commit = 'unknown'
		try {
			commit = ['git', 'rev-parse', '--short', 'HEAD'].execute(null, projectDir).text.trim() ?: 'unknown'
		} catch (ignored) {
		}
		out.parentFile.mkdirs()
		out.text = "commit=${commit}\n"
	}
}

// The licence must travel with every distributed jar, not only with the source.
// Their own folder keeps them from clashing with dependencies' META-INF/LICENSE in shadowJar.
tasks.withType(Jar).configureEach {
	dependsOn 'devBuildInfo'
	from(rootDir) {
		include 'LICENSE'
		into 'META-INF/osrs-companion'
	}
	// Only in the jar: the tests read the resources folder, so their goldens keep the plain version.
	from(devBuildDir)
}

tasks.register('run', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass

	jvmArgs "-ea", "--add-exports", "java.desktop/com.apple.eawt=ALL-UNNAMED"
	args "--developer-mode", "--debug"
}

tasks.register('shadowJar', Jar) {
	dependsOn configurations.testRuntimeClasspath
	manifest {
		attributes('Main-Class': pluginMainClass, 'Multi-Release': true)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from sourceSets.test.output
	from {
		configurations.testRuntimeClasspath.collect { file ->
			file.isDirectory() ? file : zipTree(file)
		}
	}

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier.set('shadow')
	archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}
